server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect con indirizzo relativo: mantiene la porta (8089) e il nome usati dal browser
    absolute_redirect off;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
        # Sempre la versione più recente dopo un aggiornamento dal Pi
        add_header Cache-Control "no-cache";
        # Il gioco è tutto nel browser: nessuna richiesta verso altri indirizzi
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
